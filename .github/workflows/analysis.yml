name: EURUSD AI Trading Analysis Cycle

on:
  schedule:
    # Run every 15 minutes 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: xauusd_ai.db
          key: eurusd-db-${{ github.run_id }}
          restore-keys: |
            eurusd-db-

      - name: Run Market Analysis Cycle
        env:
          BIQUOTE_BASE_URL: https://biquote.io/api
          SYMBOL: eurusd
          TIMEFRAME: 5m
          CANDLE_COUNT: 400
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Africa/Casablanca
          WORK_START_HOUR: 0
          WORK_END_HOUR: 24
          ONLY_SEND_TRADE_SIGNALS: 'true'
        run: |
          python xauusd_ai_bot/main.py --once --ignore-schedule --only-signals
